server:
  port: ${SERVER_PORT:8084}

spring:
  data:
    mongodb:
      # New database for the Meeting Room application.
      # Override MONGODB_URI when using the same MongoDB server as the sample project.
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:meeting_room_booking}
      auto-index-creation: true

app:
  # Optional for local development: TokenService will generate an in-memory 256-bit key.
  # Required when SPRING_PROFILES_ACTIVE=prod or production.
  # For shared/multi-instance deployments, always configure a persistent key.
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-expiration-minutes: 480
  # Required only when the initial admin account does not exist. Never resets existing credentials.
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  time-zone: Asia/Ho_Chi_Minh

  # Active Directory / Domain login. Defaults mirror the supplied portal source.
  ldap:
    enabled: ${LDAP_ENABLED:true}
    urls: ${LDAP_URLS:ldaps://VN-DC2.youngonevn.com:636}
    base-dn: ${LDAP_BASE_DN:DC=youngonevn,DC=com}
    domain: ${LDAP_DOMAIN:youngonevn.com}
    netbios-domain: ${LDAP_NETBIOS_DOMAIN:YOUNGONEVN}
    authentication-mode: ${LDAP_AUTHENTICATION_MODE:KERBEROS_GSSAPI}
    bare-username-bind-format: ${LDAP_BARE_USERNAME_BIND_FORMAT:NETBIOS}
    connect-timeout-ms: ${LDAP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${LDAP_READ_TIMEOUT_MS:7000}
    trust:
      enabled: ${LDAP_TRUST_ENABLED:true}
      use-jvm-default: ${LDAP_TRUST_USE_JVM_DEFAULT:true}
      use-windows-root: ${LDAP_TRUST_USE_WINDOWS_ROOT:true}
      certificate-locations: ${LDAP_TRUST_CERTIFICATE_LOCATIONS:}
  kerberos:
    realm: ${KERBEROS_REALM:YOUNGONEVN.COM}
    kdc: ${KERBEROS_KDC:VN-DC2.youngonevn.com}
    ldap-qop: ${KERBEROS_LDAP_QOP:auth}
    debug: ${KERBEROS_DEBUG:false}
  mail:
    tls:
      # Reuse LDAPS trust (JVM + Windows ROOT + configured certificate files) for
      # SMTP STARTTLS and direct SSL. No trust-all; hostname verification stays on.
      # If the SMTP issuer isn't covered by these CAs, ask IT to supply it via
      # LDAP_TRUST_CERTIFICATE_LOCATIONS (or a verified JVM truststore).
      use-domain-trust: ${MAIL_TLS_USE_DOMAIN_TRUST:true}
    # Optional external key protecting SMTP credentials. If blank, a private key is
    # generated once at ~/.meeting-room-booking/smtp-credentials.key; BACK UP that file.
    # Verified company SMTP: pop3.youngonevn.com:30475 with STARTTLS + AUTH.
    # Override with MAIL_SMTP_HOST, MAIL_SMTP_PORT, MAIL_SMTP_SECURITY (STARTTLS/SSL_TLS).
    # Never allow plaintext SMTP credentials; verify TLS support with IT.
    # An APPROVED email contains a real RFC 5545 Outlook meeting request.
    # CANCELLED after approval sends the corresponding calendar cancellation.
    # The requester receives the invitation. Attendee email addresses are not
    # collected by the current booking model (only attendeeCount).
    credentials-key: ${MAIL_CREDENTIALS_KEY:}
    # Fallback only; Admin can save Website URL in Email Management > SMTP Settings.
    base-url: ${MAIL_APP_URL:}
    poll-interval-ms: ${MAIL_POLL_INTERVAL_MS:10000}
  booking:
    business-start: "07:00"
    business-end: "18:00"
    min-duration-minutes: 15
    max-duration-minutes: 660
    max-advance-days: 90
